<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>oh.tyn</title>
  <meta name="description" content="oh.tyn" />

  <!-- 파비콘 -->
  <link rel="icon" type="image/png" href="assets/images/fabicon.png" />
  <link rel="apple-touch-icon" href="assets/images/fabicon.png" />

  <!-- 사이트 미리보기 (Open Graph / Twitter Card) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="oh.tyn" />
  <meta property="og:description" content="oh.tyn" />
  <meta property="og:image" content="https://oh-tyn.netlify.app/assets/images/thumb1.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="oh.tyn" />
  <meta name="twitter:description" content="oh.tyn" />
  <meta name="twitter:image" content="https://oh-tyn.netlify.app/assets/images/thumb1.png" />
  <link rel="image_src" href="assets/images/thumb1.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+JP:wght@500;600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ───────── 상단 바 (고정) ───────── -->
  <header class="topbar" id="topbar">
    <div class="container topbar__inner">
      <a href="#hero" class="topbar__logo" id="nav-logo" aria-label="oh.tyn 홈">
        <img src="assets/images/assets/ohtyn logo.png" alt="oh.tyn" />
      </a>
      <nav class="topbar__nav" aria-label="주 메뉴">
        <div class="sites">
          <button class="nav-link" id="nav-sites" aria-expanded="false" aria-controls="sites-popup">sites</button>
          <div class="sites__popup" id="sites-popup" role="menu"></div>
        </div>
        <a href="#works" class="nav-link" id="nav-works">works</a>
        <a href="#about" class="nav-link" id="nav-about">about</a>
        <a href="#contact" class="nav-link" id="nav-contact">contact</a>
        <div class="nav-audio-wrap" id="nav-audio-wrap" hidden>
          <button class="nav-audio" id="nav-audio" type="button" aria-label="Start/Stop" title="Click to Start Demo">
            <span class="nav-audio__note" aria-hidden="true">♪</span>
            <span class="nav-audio__bars" aria-hidden="true"><i></i><i></i><i></i></span>
          </button>
          <div class="nav-audio__panel" id="nav-audio-panel">
            <span class="nav-audio__tip" id="nav-audio-tip"></span>
            <label class="nav-audio__vol-wrap" aria-label="Volume Control">
              <span class="nav-audio__vol-icon" aria-hidden="true">VOL</span>
              <input class="nav-audio__vol" id="nav-audio-vol" type="range" min="0" max="1" step="0.01" value="0.75" />
            </label>
            <label class="nav-audio__vol-wrap" aria-label="Speed Control" title="Double click to Set 1.0x">
              <span class="nav-audio__vol-icon" id="nav-audio-spd-label" aria-hidden="true">SPD</span>
              <input class="nav-audio__vol" id="nav-audio-spd" type="range" min="0.5" max="1.6" step="0.01" value="1" />
            </label>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <!-- 필름 그레인 오버레이 (sonohoka 다크모드 시 강조) -->
  <div class="film-grain" aria-hidden="true"></div>

  <main id="main">

    <!-- ───────── 히어로 : 회전하는 지구본 ───────── -->
    <section class="hero" id="hero" data-section="hero">
      <svg class="globe" id="globe" aria-hidden="true">
        <defs id="globe-defs"></defs>
        <g id="globe-lat"></g>
        <g id="globe-lon"></g>
        <g id="globe-sats"></g>
      </svg>
      <h1 class="hero__title" id="hero-logo-btn" role="button" tabindex="0" aria-label="로고 전환">
        <img id="hero-logo" src="assets/images/assets/ohtyn logo.png" alt="oh.tyn" draggable="false" />
      </h1>
      <p class="hero__now" id="hero-now" aria-live="polite" hidden>
        now playing: <span id="hero-now-title"></span>
      </p>
    </section>

    <!-- ───────── News ───────── -->
    <section class="section" id="news" data-section="news">
      <div class="container narrow">
        <h2 class="section__label">news</h2>
        <ul class="news" id="news-list"></ul>
      </div>
    </section>

    <!-- ───────── Works (사진 그리드) ───────── -->
    <section class="section" id="works" data-section="works">
      <div class="container">
        <h2 class="section__label">works</h2>
        <ul class="grid" id="works-grid"></ul>
      </div>
    </section>

    <!-- ───────── About ───────── -->
    <section class="section" id="about" data-section="about">
      <div class="container narrow about">
        <figure class="about__photo">
          <img src="assets/images/Artist Photo.jpg" alt="Oh Taeyeon" loading="lazy" />
        </figure>
        <div class="about__body">
          <div class="about__head">
            <h2 class="section__label section__label--left">About me?</h2>
            <div class="lang" role="tablist" aria-label="언어 선택" id="lang-switch">
              <button role="tab" data-lang="en" id="lang-en">EN</button>
              <button role="tab" data-lang="kr" id="lang-kr">KR</button>
              <button role="tab" data-lang="jp" id="lang-jp">JP</button>
              <span class="lang__thumb" aria-hidden="true"></span>
            </div>
          </div>
          <p class="about__name">
            <img id="about-logo" src="assets/images/assets/ohtyn logo.png" alt="oh.tyn" />
            <span>| Oh Taeyeon</span>
          </p>
          <div class="about__text" id="about-text"></div>
          <a class="more" id="more-works" href="#works">More Works <span aria-hidden="true">→</span></a>
        </div>
      </div>
    </section>

    <!-- ───────── Contact ───────── -->
    <section class="section" id="contact" data-section="contact">
      <div class="container narrow">
        <h2 class="section__label">contact</h2>
        <address class="contact" id="contact-list"></address>
      </div>
    </section>

  </main>

  <!-- ───────── 하단 바 (고정 X) ───────── -->
  <footer class="footer">
    <div class="container footer__inner">
      <img src="assets/images/assets/ohtyn logo.png" alt="oh.tyn" />
      <small>© <span id="year"></span> Oh Taeyeon</small>
    </div>
  </footer>

  <!-- ───────── 작품 트레이 (카드 클릭 시) ───────── -->
  <div class="tray" id="tray" hidden>
    <div class="tray__backdrop" data-tray-close></div>
    <div class="tray__panel" id="tray-panel" role="dialog" aria-modal="true" aria-labelledby="tray-title">
      <div class="tray__content">
        <span class="tray__meta" id="tray-meta"></span>
        <button class="tray__close" type="button" data-tray-close aria-label="닫기">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>

        <div class="tray__head" id="tray-head"></div>

        <button class="tray__nav tray__nav--prev" type="button" id="tray-prev" aria-label="이전 사진">
          <svg viewBox="0 0 20 24" aria-hidden="true">
            <path d="M17 3 L3 12 L17 21 Z" />
          </svg>
        </button>
        <figure class="tray__stage" id="tray-stage">
          <div class="tray__frame">
            <div class="tray__track" id="tray-track"></div>
          </div>
          <div class="tray__sheet" id="tray-sheet" aria-label="밀착인화 썸네일"></div>
          <div class="tray__ticks" id="tray-ticks"></div>
        </figure>
        <button class="tray__nav tray__nav--next" type="button" id="tray-next" aria-label="다음 사진">
          <svg viewBox="0 0 20 24" aria-hidden="true">
            <path d="M3 3 L17 12 L3 21 Z" />
          </svg>
        </button>

        <p class="tray__desc" id="tray-desc"></p>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="globe.js"></script>
  <script src="tray.js"></script>
  <script src="main.js"></script>
</body>

</html>
